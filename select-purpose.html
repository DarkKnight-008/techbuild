<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
      <!-- tailwind css cdn link  and fonts link -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap');
    </style>
    <link rel="stylesheet" href="fonts.css">

    <!-- linking remix-icon cdn  -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- linking the css file : first.css  -->
    <link rel="stylesheet" href="css/first.css">

  <link rel="stylesheet" href="./css/select-purpose.css">
</head>
<body>

      <header>
        <div class="header-container">
            <div class="inner-container-1">
                <a href="#" class="logo-container">
                    <div class="logo-img-container">
                        <img src="./images/logo.png" alt="logo">
                    </div>
                    <h2>TechBuild</h2>
                </a>
                    
            </div>
            <div class="inner-container-2">
                <input type="text" name="" id="" placeholder="Search for CPUs, GPUs, or Components">
                <button><i class="ri-search-line"></i></button>
            </div>
            <div class="inner-container-3">
                <button>
                  <div class="inner-btn-cont-1">
                    <img src="./images/screw-driver.png" alt="">
                  </div>
                  <div class="inner-btn-cont-2">
                    <span>Build Your PC</span>
                  </div>
                </button>
                <i class="ri-shopping-cart-2-line header-icon"></i>
                <i class="ri-user-line header-icon"></i>
            </div>

        </div>
    </header>

<!-- breadcrumber  -->
  <nav class="breadcrumbercontainer" aria-label="Breadcrumb">
    <a href="/">Home</a>
    <span class="breadcrumb-sep">/</span>

    <a href="/components">Components</a>
    <span class="breadcrumb-sep">/</span>

    <span aria-current="page">Shopping Cart</span>
</nav>


<main>
  <section class="select-purpose-section">

    <div class="select-purpose-wrapper">
      <h1>Select your Purpose</h1>

      <div class="select-purpose-container">

        <!-- CARD 1 -->
        <div class="option-card-container">
          <div class="option-img-container">
            <img src="./images/gamimg-thumbnail-img.jpg" alt="Gaming">

            <div class="option-desc-container">
              <div class="left-container">
                <h2>Gaming</h2>
                <p>High FPS and ray tracing</p>
              </div>
              <div class="right-container">
                <button>
                  <p>Next</p>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- CARD 2 -->
        <div class="option-card-container">
          <div class="option-img-container">
            <img src="./images/workstation-thumnail-img.jpg" alt="Workstation">

            <div class="option-desc-container">
              <div class="left-container">
                <h2>Workstation</h2>
                <p>Multitasking & Reliability</p>
              </div>
              <div class="right-container">
                <button>
                  <p>Next</p>
              </button>
              </div>
            </div>
          </div>
        </div>

        <!-- CARD 3 -->
        <div class="option-card-container">
          <div class="option-img-container">
            <img src="./images/creator-thumbnail-img.jpg" alt="Creator">

            <div class="option-desc-container">
              <div class="left-container">
                <h2>Creator</h2>
                <p>Rendering & Editing</p>
              </div>
              <div class="right-container">
                <button>
                  <p>Next</p>
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

  </section>
</main>



</body>
</html>
